linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - unused
    - misspell
    - gosimple
    - ineffassign

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    enable-all: true
  misspell:
    locale: US

issues:
  exclude-rules:
    # Exclude test files from some checks
    - path: _test\.go
      linters:
        - errcheck

run:
  timeout: 5m
  go: "1.23"
